# CI: syntax checks, hermetic tests, and public-safety scans.
# Deliberately absent: live Codex Desktop IPC, real Codex/Claude state, secrets.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Shell syntax (bash -n)
        run: |
          bash -n skills/ipc/scripts/handoff_to_codex.sh
          bash -n skills/ipc/scripts/codex_ipc_replies.sh
          bash -n tests/test_ipc.sh
          bash -n tests/test_autoload_matrix.sh
          bash -n tests/test_reply_view.sh
          bash -n tests/test_retention_sweep.sh
          bash -n tests/test_rollout_reader.sh
          bash -n tests/test_reply_harvest.sh
          bash -n tests/test_session_inspect.sh
          bash -n tests/test_router_contract.sh
          bash -n tests/test_ipc_wait.sh
          bash -n tests/test_wait_contract.sh
          bash -n tests/test_uninstall_guard.sh
          bash -n tests/scan_public_safety.sh
          bash -n install.sh
          bash -n uninstall.sh

      - name: Node syntax (node --check)
        run: |
          set -e
          for f in skills/ipc/scripts/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: PowerShell parse check (autoload helper)
        # Parser-only (PSParser::Tokenize) — no execution. Windows leg only: the helper
        # is Windows-only and ubuntu runners have no powershell.exe. Full revalidate is
        # NOT run on CI: its Codex-state/desktop checks legitimately fail on runners.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw 'skills/ipc/scripts/codex_ipc_autoload.ps1'), [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output "PowerShell parse: clean"

      - name: Hermetic transport tests
        run: bash tests/test_ipc.sh

      - name: Hermetic autoload host-identity matrix
        # Runs the REAL codex_ipc_autoload.ps1 under -DryRun with mocked foreground
        # identity; never fires codex:// or touches focus. Self-skips where
        # powershell.exe is absent (ubuntu leg).
        run: bash tests/test_autoload_matrix.sh

      - name: Hermetic reply-viewer tests
        # GNU find/date required; the windows runner's Git Bash provides them.
        run: bash tests/test_reply_view.sh

      - name: Hermetic retention-sweep tests
        # Guards the unreplied-task exemption (9434721) and the keep-only default.
        # GNU find/date required; the windows runner's Git Bash provides them.
        run: bash tests/test_retention_sweep.sh

      - name: Hermetic rollout-reader tests
        run: bash tests/test_rollout_reader.sh

      - name: Hermetic dual-source reply-harvest tests
        run: bash tests/test_reply_harvest.sh

      - name: Hermetic session-inspect tests
        run: bash tests/test_session_inspect.sh

      - name: Hermetic router-contract sentinel
        run: bash tests/test_router_contract.sh

      - name: Hermetic completion-checker tests
        run: bash tests/test_ipc_wait.sh

      - name: Blind wait-contract conformance suite
        run: bash tests/test_wait_contract.sh

      - name: Uninstaller dangerous-target sentinel
        run: bash tests/test_uninstall_guard.sh

      - name: Static contract audit
        run: node skills/ipc/scripts/codex_ipc_contract_audit.mjs

      - name: Public-safety scan
        run: bash tests/scan_public_safety.sh

      - name: Installer dry-run (never a real install on CI)
        run: |
          ./install.sh --dry-run --target "$RUNNER_TEMP/skills with spaces/ipc"
          ./uninstall.sh --dry-run --target "$RUNNER_TEMP/skills with spaces/ipc"

      - name: PowerShell installer dry-run (never a real install on CI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ipc-ps-dryrun'
          ./install.ps1 -DryRun -Target $target
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Content -LiteralPath (Join-Path $target 'SKILL.md') -Value 'name: ipc'
          ./uninstall.ps1 -DryRun -Target $target

# CI: syntax checks, hermetic tests, and public-safety scans.
# Deliberately absent: live Codex Desktop IPC, real Codex/Claude state, secrets.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is REQUIRED by the release-manifest step below: the frozen
          # manifests are re-derived from BASE_SHA and from the commit recorded in
          # release/manifests/FINAL_REF, and neither is present in the default depth-1
          # clone. A shallow checkout makes that step die "ref not found", not pass.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Bash and required-tool provenance
        run: |
          set -euo pipefail
          # Direct external dependencies of tests/run_release_gates.sh and
          # tests/scan_public_safety.sh, plus the manifest hash primitive invoked by the
          # runner. Keep the scanner subset synchronized with its own fail-closed preflight.
          for tool in awk basename bash dirname find git grep mktemp node ps rm sed sha256sum sh sleep sort tail tr uname; do
            command -v "$tool" >/dev/null || { echo "missing required tool: $tool" >&2; exit 2; }
            command -v "$tool"
          done
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            for tool in powershell.exe taskkill; do
              command -v "$tool" >/dev/null || { echo "missing required Windows tool: $tool" >&2; exit 2; }
              command -v "$tool"
            done
          fi
          bash --version

      - name: Shell syntax (bash -n)
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f"
            count=$((count + 1))
          done < <(git ls-files -z -- '*.sh')
          [ "$count" -gt 0 ] || { echo "no tracked .sh files" >&2; exit 2; }

      - name: Node syntax (node --check)
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f"
            count=$((count + 1))
          done < <(git ls-files -z -- '*.mjs')
          [ "$count" -gt 0 ] || { echo "no tracked .mjs files" >&2; exit 2; }

      - name: PowerShell parse check (autoload helper)
        # Parser-only (PSParser::Tokenize) — no execution. Windows leg only: the helper
        # is Windows-only and ubuntu runners have no powershell.exe. Full revalidate is
        # NOT run on CI: its Codex-state/desktop checks legitimately fail on runners.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw -Encoding UTF8 'skills/ipc/scripts/codex_ipc_autoload.ps1'), [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output "PowerShell parse: clean"

      - name: Hermetic transport tests
        run: bash tests/test_ipc.sh

      - name: Hermetic autoload host-identity matrix
        # Runs the REAL codex_ipc_autoload.ps1 under -DryRun with mocked foreground
        # identity; never fires codex:// or touches focus. Self-skips where
        # powershell.exe is absent (ubuntu leg).
        run: bash tests/test_autoload_matrix.sh

      - name: Hermetic reply-viewer tests
        # GNU find/date required; the windows runner's Git Bash provides them.
        run: bash tests/test_reply_view.sh

      - name: Hermetic retention-sweep tests
        # Guards the unreplied-task exemption (9434721) and the keep-only default.
        # GNU find/date required; the windows runner's Git Bash provides them.
        run: bash tests/test_retention_sweep.sh

      - name: Hermetic rollout-reader tests
        run: bash tests/test_rollout_reader.sh

      - name: Hermetic dual-source reply-harvest tests
        run: bash tests/test_reply_harvest.sh

      - name: Hermetic session-inspect tests
        run: bash tests/test_session_inspect.sh

      - name: Hermetic payload/example mirror parity
        # Renders a REAL file-drop payload from a throwaway git fixture (mktemp; HOME and
        # CODEX_IPC_ROOT both redirected into it; never --ipc) and diffs its `## ` headings
        # against skills/ipc/examples/example-dispatch-payload.md. The example claimed to
        # mirror the wrapper and nothing enforced it. Run on BOTH legs: the wrapper renders
        # Windows paths through cygpath on the Windows leg only.
        run: bash tests/test_payload_mirror_parity.sh

      - name: Hermetic git-context bounding + payload advisories
        # Builds an oversized dirty git fixture (mktemp; HOME and CODEX_IPC_ROOT both
        # redirected into it; never --ipc) and asserts the 0.1.11 default bound holds, that
        # the `## Uncommitted changes` heading and body survive it (the SIGPIPE-fallback
        # class), that CODEX_IPC_GIT_CONTEXT=full restores only the three pre-bounding
        # git-context bodies inside the current payload scaffold, and that both new advisories
        # stay on stderr with stdout byte-identical.
        run: bash tests/test_git_context_bound.sh

      - name: Hermetic router-contract sentinel
        run: bash tests/test_router_contract.sh

      - name: Hermetic completion-checker tests
        run: bash tests/test_ipc_wait.sh

      - name: Blind wait-contract conformance suite
        run: bash tests/test_wait_contract.sh

      - name: Uninstaller dangerous-target sentinel
        run: bash tests/test_uninstall_guard.sh

      - name: Text integrity self-test
        run: node tests/check_text_integrity.mjs --self-test

      - name: Text integrity index
        run: node tests/check_text_integrity.mjs --source index

      - name: Text integrity worktree
        run: node tests/check_text_integrity.mjs --source worktree

      - name: Documentation quality self-test
        run: node tests/check_docs_quality.mjs --self-test

      - name: Documentation quality repository
        run: node tests/check_docs_quality.mjs

      - name: Release-manifest integrity
        # Re-derives frozen manifests without reading host-installed roots.
        run: bash tests/gen_release_manifest.sh check-all --no-roots

      - name: Process-ownership meta-gate
        run: bash tests/test_gate_process_ownership.sh

      - name: Static contract audit
        run: node skills/ipc/scripts/codex_ipc_contract_audit.mjs

      - name: Public-safety scan
        env:
          # pull_request checks run on a provider-generated merge commit. Audit the publishable
          # contributor head explicitly; the scanner intentionally ignores synthetic merge refs.
          PUBLIC_SAFETY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tests/scan_public_safety.sh

      - name: Full install.sh projection and installed docs/text policy
        run: |
          set -euo pipefail
          temp_root="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1 && [[ "$temp_root" =~ ^[A-Za-z]:[\\/] ]]; then
            temp_root="$(cygpath -u "$temp_root")"
          fi
          target="$temp_root/ipc-install-sh"
          expected="$temp_root/ipc-install-sh-expected.manifest"
          actual="$temp_root/ipc-install-sh-actual.manifest"
          normalized="$temp_root/ipc-install-sh-normalized.manifest"
          [ ! -e "$target" ] || { echo "install.sh target already exists" >&2; exit 2; }
          ./install.sh --target "$target"
          node tests/check_docs_quality.mjs --installed-root "$target"
          bash tests/gen_release_manifest.sh gen --set final-runtime --ref HEAD --out "$expected"
          bash tests/gen_release_manifest.sh gen --root "$target" --out "$actual"
          awk -F '\t' 'BEGIN { OFS="\t" } { sub(/^skills\/ipc\//, "", $3); print "N/A", $2, $3 }' "$expected" >"$normalized"
          diff -u "$normalized" "$actual"

      - name: Full install.ps1 and installed docs/text policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ipc-install-ps'
          if (Test-Path -LiteralPath $target) { throw 'install.ps1 target already exists' }
          ./install.ps1 -Target $target
          node tests/check_docs_quality.mjs --installed-root $target
          if ($LASTEXITCODE -ne 0) { throw 'installed docs/text policy failed' }

      - name: Full install.ps1 path-hash projection
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          temp_root="$(cygpath -u "$RUNNER_TEMP")"
          target="$temp_root/ipc-install-ps"
          expected="$temp_root/ipc-install-ps-expected.manifest"
          actual="$temp_root/ipc-install-ps-actual.manifest"
          normalized="$temp_root/ipc-install-ps-normalized.manifest"
          [ -d "$target" ] || { echo "install.ps1 target missing" >&2; exit 2; }
          bash tests/gen_release_manifest.sh gen --set final-runtime --ref HEAD --out "$expected"
          bash tests/gen_release_manifest.sh gen --root "$target" --out "$actual"
          awk -F '\t' 'BEGIN { OFS="\t" } { sub(/^skills\/ipc\//, "", $3); print "N/A", $2, $3 }' "$expected" >"$normalized"
          diff -u "$normalized" "$actual"

      - name: PowerShell full-install leg is inapplicable on Ubuntu
        if: runner.os != 'Windows'
        run: echo "PowerShell full-install projection is inapplicable on Ubuntu"

      - name: Installer dry-run (never a real install on CI)
        run: |
          ./install.sh --dry-run --target "$RUNNER_TEMP/skills with spaces/ipc"
          ./uninstall.sh --dry-run --target "$RUNNER_TEMP/skills with spaces/ipc"

      - name: PowerShell installer dry-run (never a real install on CI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ipc-ps-dryrun'
          ./install.ps1 -DryRun -Target $target
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Content -LiteralPath (Join-Path $target 'SKILL.md') -Value 'name: ipc'
          ./uninstall.ps1 -DryRun -Target $target

      # Hostile-spelling matrix for the PowerShell guards. The step above is a happy-path
      # dry-run only and cannot detect a guard bypass; three separate bypasses shipped while
      # it was green. This suite is the sentinel for that class.
      - name: PowerShell uninstaller dangerous-target sentinel
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_uninstall_guard.ps1
